services:
  backend:
    build:
      context: ./backend
    image: go-south-backend:local
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: go-south-frontend:local
    depends_on:
      - backend
    ports:
      - "8080:8080"
